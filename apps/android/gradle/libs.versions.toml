[versions]
# ── Kotlin ─────────────────────────────────────────────────
kotlin                      = "2.0.21"
kotlinxCoroutines           = "1.8.1"
kotlinxSerializationJson    = "1.7.3"

# ── Android / Gradle ───────────────────────────────────────
androidGradlePlugin         = "8.7.3"
compileSdk                  = "36"
minSdk                      = "29"
targetSdk                   = "36"

# ── Jetpack Compose ────────────────────────────────────────
composeBom                  = "2024.12.01"
composeCompiler             = "1.5.15"
activityCompose             = "1.9.3"

# ── Jetpack ────────────────────────────────────────────────
coreKtx                     = "1.15.0"
lifecycleRuntimeKtx         = "2.8.7"
lifecycleViewModelCompose   = "2.8.7"
navigationCompose           = "2.8.5"
workRuntimeKtx              = "2.10.0"
datastorePreferences        = "1.1.1"
roomRuntime                 = "2.6.1"

# ── Hilt ───────────────────────────────────────────────────
hilt                        = "2.52"
hiltNavigationCompose       = "1.2.0"
hiltWork                    = "1.2.0"

# ── Logging ────────────────────────────────────────────────
timber                      = "5.0.1"

# ── Testing ────────────────────────────────────────────────
junit                       = "4.13.2"
junitExt                    = "1.2.1"
espressoCore                = "3.6.1"
mockk                       = "1.13.12"
kotlinxCoroutinesTest       = "1.8.1"
turbine                     = "1.2.0"

# ── Networking (future Supabase client) ────────────────────
ktor                        = "2.3.12"

[libraries]
# ── Kotlin ─────────────────────────────────────────────────
kotlinx-coroutines-core         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",         version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",      version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json      = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",      version.ref = "kotlinxSerializationJson" }

# ── Android Core ───────────────────────────────────────────
androidx-core-ktx               = { group = "androidx.core",          name = "core-ktx",                       version.ref = "coreKtx" }
androidx-lifecycle-runtime      = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",           version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel    = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-compose",     version.ref = "lifecycleViewModelCompose" }
androidx-activity-compose       = { group = "androidx.activity",      name = "activity-compose",                version.ref = "activityCompose" }

# ── Compose ────────────────────────────────────────────────
compose-bom                     = { group = "androidx.compose",       name = "compose-bom",                     version.ref = "composeBom" }
compose-ui                      = { group = "androidx.compose.ui",    name = "ui" }
compose-ui-graphics             = { group = "androidx.compose.ui",    name = "ui-graphics" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
compose-ui-tooling              = { group = "androidx.compose.ui",    name = "ui-tooling" }
compose-material3               = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons          = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-runtime                 = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui-test-manifest        = { group = "androidx.compose.ui",    name = "ui-test-manifest" }
compose-ui-test-junit4          = { group = "androidx.compose.ui",    name = "ui-test-junit4" }

# ── Navigation ─────────────────────────────────────────────
navigation-compose              = { group = "androidx.navigation",    name = "navigation-compose",              version.ref = "navigationCompose" }

# ── Hilt ───────────────────────────────────────────────────
hilt-android                    = { group = "com.google.dagger",      name = "hilt-android",                    version.ref = "hilt" }
hilt-android-compiler           = { group = "com.google.dagger",      name = "hilt-android-compiler",           version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",          name = "hilt-navigation-compose",         version.ref = "hiltNavigationCompose" }
hilt-work                       = { group = "androidx.hilt",          name = "hilt-work",                       version.ref = "hiltWork" }
hilt-compiler                   = { group = "androidx.hilt",          name = "hilt-compiler",                   version.ref = "hiltWork" }

# ── Room ───────────────────────────────────────────────────
room-runtime                    = { group = "androidx.room",          name = "room-runtime",                    version.ref = "roomRuntime" }
room-ktx                        = { group = "androidx.room",          name = "room-ktx",                        version.ref = "roomRuntime" }
room-compiler                   = { group = "androidx.room",          name = "room-compiler",                   version.ref = "roomRuntime" }
room-testing                    = { group = "androidx.room",          name = "room-testing",                    version.ref = "roomRuntime" }

# ── DataStore ──────────────────────────────────────────────
datastore-preferences           = { group = "androidx.datastore",     name = "datastore-preferences",           version.ref = "datastorePreferences" }

# ── WorkManager ────────────────────────────────────────────
work-runtime-ktx                = { group = "androidx.work",          name = "work-runtime-ktx",                version.ref = "workRuntimeKtx" }
work-testing                    = { group = "androidx.work",          name = "work-testing",                    version.ref = "workRuntimeKtx" }

# ── Logging ────────────────────────────────────────────────
timber                          = { group = "com.jakewharton.timber", name = "timber",                          version.ref = "timber" }

# ── Networking ─────────────────────────────────────────────
ktor-client-core                = { group = "io.ktor",               name = "ktor-client-core",                 version.ref = "ktor" }
ktor-client-android             = { group = "io.ktor",               name = "ktor-client-android",              version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor",               name = "ktor-client-content-negotiation",  version.ref = "ktor" }
ktor-serialization-json         = { group = "io.ktor",               name = "ktor-serialization-kotlinx-json",  version.ref = "ktor" }

# ── Testing ────────────────────────────────────────────────
junit                           = { group = "junit",                  name = "junit",                           version.ref = "junit" }
junit-ext                       = { group = "androidx.test.ext",      name = "junit",                           version.ref = "junitExt" }
espresso-core                   = { group = "androidx.test.espresso", name = "espresso-core",                   version.ref = "espressoCore" }
mockk                           = { group = "io.mockk",               name = "mockk",                           version.ref = "mockk" }
kotlinx-coroutines-test         = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-test",         version.ref = "kotlinxCoroutinesTest" }
turbine                         = { group = "app.cash.turbine",       name = "turbine",                         version.ref = "turbine" }

[plugins]
android-application     = { id = "com.android.application",              version.ref = "androidGradlePlugin" }
android-library         = { id = "com.android.library",                  version.ref = "androidGradlePlugin" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm",             version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",       version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp",              version = "2.0.21-1.0.28" }

[bundles]
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-material-icons",
    "compose-runtime",
    "androidx-activity-compose",
]
lifecycle = [
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-viewmodel",
]
room = [
    "room-runtime",
    "room-ktx",
]
coroutines = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
]
ktor = [
    "ktor-client-core",
    "ktor-client-android",
    "ktor-client-content-negotiation",
    "ktor-serialization-json",
]
testing-unit = [
    "junit",
    "mockk",
    "kotlinx-coroutines-test",
    "turbine",
]
